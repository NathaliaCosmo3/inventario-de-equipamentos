<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário de equipamentos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff4ef;color:#142d27;font:16px/1.5 'Segoe UI',sans-serif}header{background:#12372f;color:#fff;padding:50px 0 42px;border-bottom:5px solid #a9d26f}main,.wrap{width:min(960px,92vw);margin:auto}h1{font:700 clamp(2rem,6vw,3.5rem)/1.08 Georgia,serif;margin:0 0 12px}header p{margin:0;color:#d2e5d8}main{padding:28px 0 50px}section{background:#fff;border:1px solid #cddbd1;border-radius:12px;padding:22px;margin-bottom:18px}h2{font-size:1.2rem;margin:0 0 14px}form,.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-weight:600;flex:1;min-width:150px}input,select,textarea,button{font:inherit;border-radius:6px;padding:9px 11px}input,select,textarea{width:100%;border:1px solid #829b8f;background:#fff;color:inherit}textarea{min-height:48px}button{border:1px solid #1f5d48;background:#1f5d48;color:white;font-weight:600;cursor:pointer}button:hover{background:#154634}button.secondary{background:#fff;color:#1f5d48}button.secondary:hover{background:#e8f2ec}.table{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px;border-bottom:1px solid #d9e4db;vertical-align:top}th{background:#eaf2eb}td{overflow-wrap:anywhere}output{display:block;margin:14px 0 0;font-weight:600}output:empty{display:none}small{color:#425a50}.actions{display:flex;flex-wrap:wrap;gap:8px}a{color:#1f5d48}:focus-visible{outline:3px solid #b76a21;outline-offset:2px}ul{margin-bottom:0}</style>
</head>
<body>
<header><div class="wrap"><h1>Inventário de equipamentos</h1><p>Cadastro e consulta de patrimônio de TI, com dados de exemplo.</p></div></header>
<main><section><h2>Cadastro de equipamento</h2><form id="entry"><label>Patrimônio<input name="id" required maxlength="30" placeholder="TI-004"></label><label>Equipamento<input name="name" required maxlength="80"></label><label>Setor<input name="sector" required maxlength="80"></label><label>Status<select name="status"><option>Disponível</option><option>Em uso</option><option>Manutenção</option></select></label><button>Salvar</button><button type="button" id="reset" class="secondary">Limpar</button></form><output id="message" aria-live="polite"></output></section><section><h2>Equipamentos</h2><div class="filters"><label>Pesquisar<input id="search" type="search" placeholder="Patrimônio, nome ou setor"></label><label>Status<select id="status"><option>Todos</option><option>Disponível</option><option>Em uso</option><option>Manutenção</option></select></label><button id="export" class="secondary">Exportar CSV</button></div><p id="stats" aria-live="polite"></p><div class="table"><table><thead><tr><th>Patrimônio</th><th>Equipamento</th><th>Setor</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<p><small>Projeto de portfólio • use dados fictícios.</small></p></main>
<script>
const by=id=>document.getElementById(id); const report=message=>{by('message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); const persist=(key,data)=>localStorage.setItem(key,JSON.stringify(data)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}; const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\-\t\r\n]/.test(text.trimStart())||/^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const content=rows.map(row=>row.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const key='nathalia-inventario-v1';let items=load(key,[{id:'TI-001',name:'Notebook',sector:'Atendimento',status:'Em uso'},{id:'TI-002',name:'Impressora',sector:'Administrativo',status:'Manutenção'},{id:'TI-003',name:'Monitor',sector:'Estoque',status:'Disponível'}]);let editing=null;const form=by('entry');function filtered(){const search=normalize(by('search').value.trim());return items.filter(item=>(by('status').value==='Todos'||by('status').value===item.status)&&normalize(item.id+' '+item.name+' '+item.sector).includes(search));}function render(){const rows=by('rows');rows.replaceChildren();const visible=filtered();by('stats').textContent=visible.length+' de '+items.length+' equipamento(s) • '+items.filter(item=>item.status==='Manutenção').length+' em manutenção';for(const item of visible){const row=rows.insertRow();for(const field of ['id','name','sector','status'])cell(row,item[field]);addButton(cell(row,''),'Editar',()=>{editing=item.id;for(const field of ['id','name','sector','status'])form.elements.namedItem(field).value=item[field];form.elements.namedItem('id').readOnly=true;form.elements.namedItem('name').focus();});}}function reset(){editing=null;form.reset();form.elements.namedItem('id').readOnly=false;}form.addEventListener('submit',event=>{event.preventDefault();const values=new FormData(form);const item={id:values.get('id').trim().toUpperCase(),name:values.get('name').trim(),sector:values.get('sector').trim(),status:values.get('status')};if(!item.id||!item.name||!item.sector){report('Preencha patrimônio, equipamento e setor.');return;}if(!editing&&items.some(entry=>entry.id===item.id)){report('Já existe um equipamento com esse patrimônio.');return;}const next=editing?items.map(entry=>entry.id===editing?item:entry):[...items,item];try{persist(key,next);}catch{report('O navegador não autorizou o armazenamento local.');return;}items=next;reset();render();report('Equipamento '+item.id+' salvo.');});by('reset').addEventListener('click',reset);by('search').addEventListener('input',render);by('status').addEventListener('change',render);by('export').addEventListener('click',()=>csvExport('inventario.csv',[['patrimonio','equipamento','setor','status'],...filtered().map(item=>[item.id,item.name,item.sector,item.status])]));render();
</script>
</body>
</html>
